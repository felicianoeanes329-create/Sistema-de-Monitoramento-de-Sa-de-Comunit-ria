<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      font-family: Arial, sans-serif;
    }
    .login-container {
      background: #fff;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0px 4px 15px rgba(0,0,0,0.2);
      text-align: center;
      width: 350px;
    }
    .login-container h1 {
      font-size: 2.2em;
      margin-bottom: 10px;
      color: #333;
    }
    .descricao-smsc {
      font-size: 0.95em;
      color: #555;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .login-container input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1em;
    }
    .login-container button {
      width: 100%;
      padding: 12px;
      background: #4facfe;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 1.1em;
      cursor: pointer;
      transition: 0.3s;
    }
    .login-container button:hover {
      background: #00c6fb;
    }
    .nota {
      font-size: 0.85em;
      color: #666;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>Login</h1>
    <div class="descricao-smsc">
      Aceda ao <strong>Sistema de Monitoramento de Saúde Comunitária (SMSC)</strong> para gerir sintomas, registos e utilizadores com segurança e eficiência.
    </div>

    <form id="formLogin">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="senha" placeholder="Senha" required>
      <button type="submit">Entrar</button>
      <div class="nota">Primeiro acesso: admin@1 / 1234</div>
    </form>
  </div>

  <script>
    //Garante que o admin existe sempre com todos os campos
    (function garantirAdminPadrao() {
      let utilizadores = JSON.parse(localStorage.getItem("utilizadores")) || [];

      const existeAdmin = utilizadores.some(u => u.email === "admin@1");
      if (!existeAdmin) {
        utilizadores.push({
          nome: "Administrador",
          email: "admin@1",
          senha: "1234",
          confirmarSenha: "1234", // 🔑 campo extra para consistência
          perfil: "Administrador"
        });
        localStorage.setItem("utilizadores", JSON.stringify(utilizadores));
      }
    })();

    document.getElementById("formLogin").addEventListener("submit", (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;

      const utilizadores = JSON.parse(localStorage.getItem("utilizadores")) || [];
      const user = utilizadores.find(u => u.email === email && u.senha === senha);

      if (user) {
        localStorage.setItem("auth", JSON.stringify({
          logged: true,
          perfil: user.perfil,
          nome: user.nome
        }));
        localStorage.setItem("utilizadorLogado", JSON.stringify(user));

        alert("Bem-vindo ao Sistema de Monitoramento de Saúde Comunitária (SMSC), " + user.nome + "!");
        window.location.href = "index.html";
      } else {
        alert("Email ou senha inválidos!");
      }
    });
  </script>
</body>
</html>
