<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Configurações</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f5f5f5;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .card {
      background: #fff;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.3s ease, color 0.3s ease;
    }

    /* Efeito ao passar o mouse */
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .actions {
      text-align: center;
      margin-top: 20px;
    }

    button {
      margin: 5px;
      padding: 8px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s ease;
      background: #007BFF;
      color: #fff;
    }

    button:hover {
      background: #0056b3;
    }

    select {
      padding: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    /* Switch de notificações */
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 25px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 25px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 19px;
      width: 19px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #4CAF50;
    }

    input:checked + .slider:before {
      transform: translateX(24px);
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #333;
      color: #fff;
      padding: 10px 20px;
      border-radius: 5px;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    /* Tema claro */
    body.claro {
      background-color: #f9f9f9;
      color: #222;
    }
    body.claro .card {
      background: #fff;
      border: 1px solid #ddd;
    }

    /* Tema escuro */
    body.escuro {
      background-color: #222;
      color: #f9f9f9;
    }
    body.escuro .card {
      background: #333;
      border: 1px solid #555;
    }
    body.escuro h1 {
      color: #0d6efd;
    }
    body.escuro button {
      background: #555;
      color: #fff;
    }
    body.escuro button:hover {
      background: #777;
    }
  </style>
</head>
<body class="claro">

  <script>
  // Verifica se o utilizador está logado
  const auth = JSON.parse(localStorage.getItem("auth") || "{}");

  if (!auth.logged) {
    // Se não estiver logado, redireciona para login
    location.href = "login.html";
  }
</script>


  
  <div class="container">
    <h1>Configurações</h1>

    

    <!-- Idioma -->
    <div class="card">
      <h2>Idioma</h2>
      <select id="idioma">
        <option value="pt">Português</option>
        <option value="en">Inglês</option>
      </select>
    </div>

    <!-- Tema -->
    <div class="card">
      <h2>Tema</h2>
      <button id="temaClaro">Claro</button>
      <button id="temaEscuro">Escuro</button>
    </div>

    <!-- Notificações -->
    <div class="card">
      <h2>Notificações</h2>
      <label class="switch">
        <input type="checkbox" id="notificacoes">
        <span class="slider"></span>
      </label>
    </div>

    <!-- Limpar dados -->
    <div class="card">
      <h2>Dados</h2>
      <button id="limparDados">Apagar todos os registos</button>
    </div>
       
<!-- Exportar / Importar -->
<div class="card">
  <h2>Exportar / Importar Dados</h2>

<!-- Botão principal -->
<button id="exportar">Exportar registos</button>

<!-- Área oculta que só aparece depois -->
<div id="intervaloExportar" style="display:none; margin-top:10px; gap:10px; align-items:center; flex-wrap:wrap;">
  <!-- Primeiro os botões -->
  <button onclick="exportarJSON()" style="font-size:12px; padding:6px 10px;">Exportar JSON</button>
  <button onclick="exportarPDF()" style="font-size:12px; padding:6px 10px;">Exportar PDF</button>

  <!-- Depois os limites -->
  <label style="font-size:12px;">De:</label>
  <input type="date" id="dataInicio" style="width:120px; font-size:12px;">

  <label style="font-size:12px;">Até:</label>
  <input type="date" id="dataFim" style="width:120px; font-size:12px;">
</div>


  <!-- Botão importar e campo de ficheiro -->
  <div style="margin-top: 10px; display: flex; gap: 10px; align-items: center;">
    <button id="importar">Importar registos</button>
    <input type="file" id="ficheiroImportar" accept=".json">
  </div>
</div>




<!-- Sobre -->
    <div class="card">
      <h2>Sobre</h2>
      <p>Sistema de registo e análise de sintomas comunitários. Versão 1.0</p>
    </div>

<div class="card">
  <h2>Sessão</h2>
  <button id="btnSair">Sair da conta</button>
</div>

    <div class="actions">
      <a href="index.html"><button>Menu principal</button></a>
    </div>
  </div>

  

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

 <script>
  document.addEventListener("DOMContentLoaded", () => {
    const restricao = localStorage.getItem("restricaoConfig");

    if (restricao === "true") {
      // Esconde botões sensíveis
      const btnLimpar = document.getElementById("limparDados");
      const btnExportar = document.getElementById("exportar");
      const btnImportar = document.getElementById("importar");
      const inputFicheiro = document.getElementById("ficheiroImportar");

      if (btnLimpar) btnLimpar.style.display = "none";
      if (btnExportar) btnExportar.style.display = "none";
      if (btnImportar) btnImportar.style.display = "none";
      if (inputFicheiro) inputFicheiro.style.display = "none";
    }
  });
</script>

  <script src="configuracoes.js"></script>

 <script>
  const btnSair = document.getElementById("btnSair");
  btnSair.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();

    const confirmar = confirm("Deseja realmente sair da conta?");
    if (confirmar) {
      localStorage.removeItem("auth");
      localStorage.removeItem("utilizadorLogado");
      window.location.href = "login.html";
    }

  });
</script>


</body>
</html>
