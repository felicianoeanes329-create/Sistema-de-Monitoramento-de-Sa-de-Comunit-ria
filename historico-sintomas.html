<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Histórico de Sintomas</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .container { max-width: 880px; margin: 24px auto; font-family: Arial, sans-serif; }
    h1 { margin-bottom: 12px; color: #0d6efd; }

    .card { position: relative; border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 12px; }

    .registro {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 8px;
    }
    .registro div { display: flex; flex-direction: column; }
    .registro label { font-weight: bold; font-size: 13px; margin-bottom: 2px; }
    .registro span { font-size: 14px; }

    .sintomas, .observacoes { margin-top: 6px; font-size: 14px; }
    .sintomas label, .observacoes label { font-weight: bold; font-size: 13px; margin-bottom: 2px; }

    .risco { font-weight: bold; margin-top: 6px; }
    .risco.leve { color: green; }
    .risco.moderado { color: orange; }
    .risco.grave { color: red; }

    .menu-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #eee;
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      font-size: 18px;
      cursor: pointer;
      color: #333;
    }
    .menu-btn:hover { background: #ddd; }

    .menu-opcoes {
      display: none;
      position: absolute;
      top: 36px;
      right: 8px;
      background: #f9f9f9;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      z-index: 100;
    }
    .menu-opcoes button {
      display: block;
      width: 100%;
      padding: 8px 14px;
      background: none;
      border: none;
      text-align: left;
      cursor: pointer;
      font-size: 13px;
      color: #333;
    }
    .menu-opcoes button:hover { background: #e6e6e6; }

    .actions { margin-top: 16px; display: flex; gap: 8px; }
    button { padding: 6px 12px; background: #0d6efd; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
    button:hover { background: #084dbf; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .search { padding: 6px; border: 1px solid #ccc; border-radius: 6px; }
    .contador { font-size: 14px; font-weight: bold; }
  </style>
</head>
<body>

<script>
  // Verifica se o utilizador está logado
  const auth = JSON.parse(localStorage.getItem("auth") || "{}");

  if (!auth.logged) {
    // Se não estiver logado, redireciona para login
    location.href = "login.html";
  }
</script>


  <div class="container">
    <h1>Histórico de Sintomas</h1>

    <script>
      const tema = localStorage.getItem("tema");
      document.body.classList.add(tema ? tema : "claro");
    </script>

    <div class="top-bar">
      <input type="text" id="pesquisa" class="search" placeholder="Pesquisar por nome...">
      <div id="contador" class="contador"></div>
    </div>

    <div id="lista-registros"></div>

    <div class="actions">
      <a href="registrar-sintomas.html"><button type="button">Novo registo</button></a>
      <button type="button" onclick="limparHistorico()">Limpar histórico</button>
      <a href="index.html"><button type="button">Menu principal</button></a>
    </div>

    <script>
      
      function normalizar(texto) {
        return (texto || "")
          .toString()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .trim()
          .toLowerCase();
      }

    function carregarHistorico() {
  const lista = document.getElementById("lista-registros");
  lista.innerHTML = "";

  // Lê todos os registos do storage e anexa o índice original
  const todos = JSON.parse(localStorage.getItem("registros")) || [];
  let registros = todos.map((r, idxOriginal) => ({ ...r, idxOriginal }));

  const termoBruto = document.getElementById("pesquisa").value;
  const termo = normalizar(termoBruto);
  if (termo) {
    
    registros = registros.filter(r => normalizar(r.paciente).startsWith(termo));
  }

  if (registros.length === 0) {
    lista.innerHTML = "<p>Nenhum registo encontrado.</p>";
    atualizarContador([]);
    return;
  }

       registros = registros.sort((a, b) => new Date(b.data) - new Date(a.data));


      
        registros.forEach((r, renderIdx) => {
          const riscoTexto = r.risco === "Verde" ? "Leve" : r.risco === "Amarelo" ? "Moderado" : "Grave";
          const riscoClasse = riscoTexto.toLowerCase();

          const card = document.createElement("div");
          card.className = "card";

          // Usa renderIdx para o id do menu (único no DOM) e idxOriginal para ações (editar/eliminar corretas no storage)
          card.innerHTML = `
            <button class="menu-btn" onclick="toggleMenu(${renderIdx})">⋮</button>
            <div class="menu-opcoes" id="menu-${renderIdx}">
              <button onclick="editarRegistro(${r.idxOriginal})">Editar</button>
              <button onclick="eliminarRegistro(${r.idxOriginal})">Eliminar</button>
            </div>
            <div class="registro">
              <div><label>Nome</label><span>${r.paciente}</span></div>
              <div><label>Sexo</label><span>${r.sexo}</span></div>
              <div><label>Idade</label><span>${r.idade}</span></div>
              <div><label>Data</label><span>${r.data}</span></div>
            </div>
            <div class="registro">
              <div><label>Temperatura</label><span>${r.temperatura} °C</span></div>
              <div><label>Risco</label><span class="risco ${riscoClasse}">${riscoTexto}</span></div>
            </div>
            <div class="sintomas">
  <label>Sintomas:</label>
  <span>${r.sintomas && r.sintomas.length > 0 ? r.sintomas.join(", ") : "&nbsp;Não tem sintomas"}</span>
</div>

            <div class="observacoes"><label>Observações:</label><span>${r.observacoes || "-"}</span></div>
          `;

          lista.appendChild(card);
        });
        atualizarContador(registros);
      }

      function toggleMenu(renderIdx) {
        // Fecha todos os menus antes
        document.querySelectorAll(".menu-opcoes").forEach(m => m.style.display = "none");
        const menu = document.getElementById(`menu-${renderIdx}`);
        if (menu) menu.style.display = "block";
      }

      function editarRegistro(idxOriginal) {
        localStorage.setItem("registroEditar", idxOriginal);
        window.location.href = "editar-sintomas.html";
      }

      function eliminarRegistro(idxOriginal) {
        if (confirm("Tem certeza que deseja eliminar este registo?")) {
          let registros = JSON.parse(localStorage.getItem("registros")) || [];
          // Remove pelo índice original
          registros.splice(idxOriginal, 1);
          localStorage.setItem("registros", JSON.stringify(registros));
          carregarHistorico();
        }
      }

      function atualizarContador(registros) {
        const contador = document.getElementById("contador");
        if (!registros || registros.length === 0) {
          contador.textContent = "0 registos";
          return;
        }
        const verdes = registros.filter(r => r.risco === "Verde").length;
        const amarelos = registros.filter(r => r.risco === "Amarelo").length;
        const vermelhos = registros.filter(r => r.risco === "Vermelho").length;

        contador.innerHTML = `
          Total: ${registros.length} |
          <span style="color:green; font-size:18px;">●</span> Leve: ${verdes} |
          <span style="color:orange; font-size:18px;">●</span> Moderado: ${amarelos} |
          <span style="color:red; font-size:18px;">●</span> Grave: ${vermelhos}
        `;
      }

      function limparHistorico() {
        if (confirm("Tem certeza que deseja limpar todo o histórico?")) {
          localStorage.removeItem("registros");
          carregarHistorico();
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        carregarHistorico();
        // Pesquisa responsiva
        document.getElementById("pesquisa").addEventListener("input", carregarHistorico);

        // Restrição para usuário normal
        const restricao = localStorage.getItem("restricaoConfig");
        if (restricao === "true") {
          const btnLimpar = document.querySelector("button[onclick='limparHistorico()']");
          if (btnLimpar) btnLimpar.style.display = "none";
        }
      });
    </script>
  </div>
</body>
</html>
